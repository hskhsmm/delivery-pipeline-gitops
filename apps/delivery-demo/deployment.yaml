apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-demo
spec:
  replicas: 1
  # 기존 Pod 하나를 유지한 채 새 Pod의 준비 상태를 확인한다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # 샌드박스 실습에서 실패 상태를 관찰할 시간을 줄인다.
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app: delivery-demo
  template:
    metadata:
      labels:
        app: delivery-demo
    spec:
      containers:
        - name: delivery-demo
          image: docker.io/smini/delivery-pipeline-demo@sha256:235a3084796106279a134fc9c2fe72af495e1ad59a09a4e40cab6fe2ec3a4d88
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              # 실험용으로 존재하지 않는 경로를 지정해 HTTP 404를 발생시킨다.
              # 복구 PR에서는 이 커밋을 revert해 /health로 되돌린다.
              path: /readiness-failure-demo
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 192Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
